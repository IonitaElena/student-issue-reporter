server:
  port: 8080

spring:
  servlet:
    multipart:
      enabled: false
  application:
    name: api-gateway
  config:
    import: optional:file:../../.env[.properties]
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service-auth
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            - id: user-service-users
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1
            - id: complaint-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/complaints/**
              filters:
                - StripPrefix=1

jwt:
  secret: ${JWT_SECRET}

app:
  cors:
    allowed-origins: http://localhost:5173