server:
  port: 8082

spring:
  application:
    name: complaint-service
  config:
    import: optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5434/${COMPLAINT_DB_NAME}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true