server:
  port: 8082

spring:
  application:
    name: complaint-service
  web:
    error:
      include-message: always
  config:
    import: optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5434/${COMPLAINT_DB_NAME}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  upload-dir: uploads