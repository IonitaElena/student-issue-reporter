server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5433/user_db
    username: postgres
    password: ${DB_PASSWORD:elena}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdef}
  expiration-ms: 86400000

app:
  admin-registration-enabled: true