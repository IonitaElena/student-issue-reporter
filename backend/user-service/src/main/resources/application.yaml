server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/${USER_DB_NAME}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

app:
  admin-registration-enabled: true