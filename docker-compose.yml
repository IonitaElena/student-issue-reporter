services:
  user-db:
    image: postgres:16
    container_name: user-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data

  complaint-db:
    image: postgis/postgis:16-3.4
    container_name: complaint-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${COMPLAINT_DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - complaint-db-data:/var/lib/postgresql/data

  ai-db:
    image: postgres:16
    container_name: ai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${AI_DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - ai-db-data:/var/lib/postgresql/data

  analytics-db:
    image: postgres:16
    container_name: analytics-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${ANALYTICS_DB_NAME}
    ports:
      - "5436:5432"
    volumes:
      - analytics-db-data:/var/lib/postgresql/data

volumes:
  user-db-data:
  complaint-db-data:
  ai-db-data:
  analytics-db-data: